[project]
name = "path-tree-sorter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []


[tool.ruff]
cache-dir = "~/.cache/ruff"
force-exclude = true
preview = true
show-fixes = true
unsafe-fixes = true
line-length = 79

[tool.ruff.analyze]
detect-string-imports = true
preview = true

[tool.ruff.format]
docstring-code-format = true
nested-string-quote-style = "preferred"
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D212", "CPY", "D100", "D105"]
preview = true

[tool.ruff.lint.pycodestyle]
max-line-length = 120